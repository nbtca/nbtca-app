name: nbtca_app
description: "NBTCA Android App - 拔电关机校园极客生活与服务终端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.4+1
  url_launcher: ^6.3.1
  intl: ^0.20.3
  webview_flutter: ^4.14.1
  crypto: ^3.0.7
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

