name: Release Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 从仓库 secrets 还原签名（与本地 .signing 同一套 keystore）
      - name: Restore signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少签名 secrets，将产出未签名包且不发布 release"
            echo "signed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p .signing
          echo "$KEYSTORE_BASE64" | base64 -d > .signing/nbtca-release.jks
          {
            echo "storeFile=.signing/nbtca-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "signed=true" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          CORE="${VERSION%%-*}"
          MAJOR="$(echo "$CORE" | cut -d. -f1)"
          MINOR="$(echo "$CORE" | cut -d. -f2)"
          PATCH="$(echo "$CORE" | cut -d. -f3)"
          # 预发布用 beta/rc 序号占低两位，正式版固定 90，保证 stable > 同版本 pre-release
          PRE=90
          if [[ "$VERSION" =~ -(beta|rc)\.([0-9]+)$ ]]; then
            PRE="${BASH_REMATCH[2]}"
          fi
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + PRE ))
          echo "打包版本：$VERSION（versionCode=$VERSION_CODE）"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE" --stacktrace
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Verify signing
        if: env.signed == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -r | head -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbtca-app-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release with APK
        if: env.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: NBTCA 拔电关机 v${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


